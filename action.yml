name: Autonomous Tag
description: Automatically create tags according to conventional commits
author: oobook
branding:
  icon: target
  color: yellow
inputs:
  test:
    description: run mode of the action
    required: false
    default: 'false'
  tag:
    description: run mode of the action
    required: false
  gh_token:
    description: GitHub token with repo access
    required: true
  prerelease:
    description: prerelease mode of the action
    required: false
  initial_tag:
    description: initial tag of the action
    required: false
    default: 'v0.0.0'
  force_release:
    description: Force stabil release mode of the action if on prerelease
    required: false
    default: 'false'
outputs:
  tag:
    description: 'The new auto-generated tag'
  ref:
    description: 'The new tag ref'
runs:
  using: node20
  main: dist/index.js
